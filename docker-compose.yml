services:
  mysql:
    image: mysql:8.4
    container_name: wrg-mysql
    environment:
      MYSQL_DATABASE: wrg
      MYSQL_USER: wrg
      MYSQL_PASSWORD: wrg_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - wrg_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  wrg_mysql_data:
